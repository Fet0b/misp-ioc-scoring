[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "misp-ioc-scoring"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "APScheduler>=3.10,<4",
    "openpyxl>=3.1,<4",
    "psycopg[binary]>=3.1,<4",
    "pydantic>=2,<3",
    "pymisp>=2.4,<3",
    "SQLAlchemy>=2,<3",
]

[project.optional-dependencies]
dev = [
    "import-linter>=2,<3",
    "pytest>=8,<10",
]

[tool.setuptools.packages.find]
where = ["src"]
